# Nginx configuration for macOS (Homebrew)
upstream express_cluster {
    # IP hash for sticky sessions - same client always goes to same backend
    #ip_hash;

    # PM2 managed Express instances
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
    server 127.0.0.1:3003;
}

server {
    listen 8081;
    server_name localhost;

    # Apple Silicon: /opt/homebrew/var/log/nginx/
    # Intel Mac: /usr/local/var/log/nginx/
    access_log /opt/homebrew/var/log/nginx/voting_access.log;
    error_log /opt/homebrew/var/log/nginx/voting_error.log;

    location / {
        proxy_pass http://express_cluster;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        access_log off;
        proxy_pass http://express_cluster;
        proxy_set_header Host $host;
    }
}
