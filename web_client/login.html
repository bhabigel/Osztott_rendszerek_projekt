<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés – Szavazó Rendszer</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Task 14 - Bejelentkezés felület -->
<nav>
    <a class="nav-brand" href="/index.html">Szavazó Rendszer</a>
    <div class="nav-links">
        <a href="/index.html">Főoldal</a>
        <a href="/vote.html">Szavazás</a>
        <a href="/results.html">Eredmények</a>
        <a href="/login.html" class="active" id="nav-login">Bejelentkezés</a>
        <a href="/register.html" id="nav-register">Regisztráció</a>
        <div id="nav-user" style="display:none; align-items:center; gap:8px;">
            <span class="nav-username" id="nav-username"></span>
            <button class="btn-nav-logout" id="nav-logout">Kilépés</button>
        </div>
    </div>
</nav>

<main>
    <div class="container-sm">
        <div class="card">
            <h1 class="page-title">Bejelentkezés</h1>
            <p class="page-subtitle">Lépj be a fiókodba a szavazáshoz.</p>

            <div id="login-alert" class="alert"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Felhasználónév vagy email</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Jelszó</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary">Bejelentkezés</button>
            </form>

            <p class="auth-link">Nincs még fiókod? <a href="/register.html">Regisztrálj</a></p>
        </div>
    </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
